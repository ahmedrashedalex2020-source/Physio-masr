    <script>
      (function () {
        var CURRENT_UI_VERSION = '2026-10-25-v6';
        try {
          var savedVersion = localStorage.getItem('physio_ui_build_version');
          if (savedVersion !== CURRENT_UI_VERSION) {
            localStorage.setItem('physio_ui_build_version', CURRENT_UI_VERSION);
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).then(function () {
                if (!window.location.search.includes('v=' + CURRENT_UI_VERSION)) {
                  var url = new URL(window.location.href);
                  url.searchParams.set('v', CURRENT_UI_VERSION);
                  window.location.replace(url.toString());
                }
              });
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js?v=6', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update().catch(() => {});
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
